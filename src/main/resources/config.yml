# ============================================================
#  Randomize_Chest — configuration
#  Chaque joueur obtient son propre butin dans les conteneurs
#  générés naturellement (structures, donjons, villages...).
#  Les conteneurs posés par les joueurs ne sont jamais concernés.
# ============================================================

worlds:
  # blacklist = actif partout SAUF dans la liste
  # whitelist = actif UNIQUEMENT dans la liste
  mode: blacklist
  list: []

containers:
  # Types de blocs pris en charge (ils doivent avoir une table de loot à la génération)
  blocks:
    - CHEST
    - TRAPPED_CHEST
    - BARREL
  # Wagonnets à coffre des mineshafts
  minecarts: true

loot:
  # random     : tirage aléatoire différent pour chaque joueur (comme Lootr)
  # per-player : tirage fixe par joueur (même résultat s'il est réinitialisé)
  # shared     : même contenu pour tout le monde, mais chacun a sa copie
  seed-mode: random
  # Nombre d'heures avant que le butin d'un joueur se régénère (0 = jamais)
  refill-hours: 0
  # Titre de l'inventaire (MiniMessage)
  inventory-title: "<dark_green>Butin personnel"

protection:
  # Empêche de casser un conteneur à butin (sauf accroupi avec randomizechest.break)
  break: true
  # Empêche les explosions de détruire les conteneurs à butin
  explosions: true
  # Empêche les entonnoirs d'insérer/retirer des objets
  hoppers: true

# Habillage visuel (comme Lootr) : chaque coffre à butin est recouvert par un modèle
# de votre resource pack, et ce modèle dépend du joueur qui regarde :
#   - item-model        : joueurs qui n'ont PAS encore ouvert ce coffre
#   - opened-item-model : joueurs qui l'ont DÉJÀ ouvert
# Deux joueurs devant le même coffre peuvent donc voir deux textures différentes.
# Activez-le quand vos textures sont prêtes : /rchest reload applique les changements.
visual:
  enabled: false
  item-model: "randomize_chest:loot_chest"
  opened-item-model: "randomize_chest:loot_chest_opened"
  # Modèles propres à un type de bloc (sinon ceux ci-dessus sont utilisés)
  per-block:
    TRAPPED_CHEST:
      item-model: "randomize_chest:loot_trapped_chest"
      opened-item-model: "randomize_chest:loot_trapped_chest_opened"
    BARREL:
      item-model: "randomize_chest:loot_barrel"
      opened-item-model: "randomize_chest:loot_barrel_opened"
  # NONE, FIXED, HEAD, GUI, GROUND...
  transform: NONE
  scale: 1.0
  # Hauteur du centre du modèle depuis le bas du bloc (0.5 = centre du bloc)
  y-offset: 0.5
  # Rotation supplémentaire en degrés si votre modèle n'est pas orienté comme prévu
  # (face avant du modèle = face sud, comme le coffre vanilla)
  yaw-offset: 0

# Pack de ressources des coffres à butin. Il est inclus dans le plugin et extrait dans
# plugins/Randomize_Chest/resourcepack/ : remplacez-y les textures, puis /rchest reload.
# Le pack compressé est aussi écrit dans plugins/Randomize_Chest/Randomize_Chest-pack.zip.
# Il n'est envoyé que si visual.enabled vaut true.
resource-pack:
  # builtin  : le plugin héberge le pack lui-même et l'envoie aux joueurs à la connexion,
  #            en plus des autres packs du serveur (il ne les remplace pas).
  # disabled : rien n'est envoyé. À utiliser si vous fusionnez vos packs avec un autre
  #            plugin (RSPM...) : donnez-lui le dossier ou le zip ci-dessus.
  mode: builtin
  # Port TCP du petit serveur web intégré. Il doit être ouvert dans le pare-feu / panel.
  port: 8164
  # Adresse d'écoute (0.0.0.0 = toutes les interfaces)
  bind: "0.0.0.0"
  # Adresse publique utilisée dans le lien envoyé aux joueurs.
  # Vide = l'adresse que chaque joueur a utilisée pour se connecter (domaine ou IP).
  public-host: ""
  # Port public si différent du port d'écoute (redirection, proxy). 0 = même que port.
  public-port: 0
  # true = les joueurs qui refusent le pack sont déconnectés
  required: false
  # Message affiché avec la demande de téléchargement (MiniMessage)
  prompt: "<gold>Textures des coffres à butin"

messages:
  prefix: "<gray>[<gold>Butin</gold>]</gray> "
  no-permission: "<red>Vous n'avez pas la permission."
  break-protected: "<red>Ce coffre contient un butin personnel : il ne peut pas être cassé."
  break-hint: "<gray>(Accroupissez-vous pour le casser si vous en avez la permission.)"
  reloaded: "<green>Configuration rechargée."
  not-a-loot-container: "<red>Visez un conteneur à butin personnel."
  info: "<yellow>ID : <white><id></white>\n<yellow>Table : <white><table></white>\n<yellow>Joueurs ayant un butin : <white><count></white>"
  reset-all: "<green>Butin réinitialisé pour tous les joueurs."
  reset-player: "<green>Butin réinitialisé pour <white><player></white>."
  unknown-player: "<red>Joueur inconnu : <white><player></white>"
  scan-done: "<green><count> conteneur(s) converti(s) dans les chunks chargés."
  visuals-refreshed: "<green><count> habillage(s) visuel(s) recréé(s)."
  visuals-disabled: "<red>L'habillage visuel est désactivé dans la configuration."
  pack-info: "<yellow>Mode : <white><mode></white>\n<yellow>Lien : <white><url></white>\n<yellow>SHA-1 : <white><sha1></white>\n<yellow>Taille : <white><size> octets</white>\n<yellow>Dossier : <white><folder></white>"
  pack-sent: "<green>Pack de ressources renvoyé à <white><count></white> joueur(s)."
  pack-inactive: "<red>L'envoi du pack est inactif (resource-pack.mode, visual.enabled ou port indisponible)."
  usage: "<gray>/rchest <white>reload | info | reset [joueur] | scan | visuals refresh | pack [resend]"
